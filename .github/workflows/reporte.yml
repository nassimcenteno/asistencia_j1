name: Reporte Asistencia J1

on:
  schedule:
    - cron: "0 14 * * 1,2"   # lunes y martes, 9:00 a. m. hora de Lima
    - cron: "0 7 * * 3"      # miércoles, 2:00 a. m. hora de Lima: la semana ya sale cerrada
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar en Pages (si no, solo comprueba que lee el Fact y el maestro y genera el dashboard)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Lima                          # GitHub corre en UTC y con horas de retraso: sin esto, un martes por la noche contaria como miercoles y cerraria la semana antes
      J1_FACT_ASISTENCIA_ID: "1OMRgDbP4Zjtd4q2RVlUA2mFRlYstZRLtFeyySGXcHls"        # Fact_Asistencia_J1 (no es un secreto)
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Registrar en el Fact la mentoria (8. Mentores)
        continue-on-error: true               # si no puede escribir, el dashboard igual aplica la regla
        run: python tools/asistencia/asistencia_mentoria.py --ejecutar
      - name: Generar el dashboard (los logs solo muestran conteos)
        run: python generador/generar_dashboard.py --fact --salida site/index.html
      - if: github.event_name == 'schedule' || inputs.publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: generar
    if: github.event_name == 'schedule' || inputs.publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
