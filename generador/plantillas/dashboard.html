<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Asistencia J1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--r-lg:18px;--r-md:12px;--ease:cubic-bezier(.2,.8,.2,1)}
/* ===== PALETA "OBSIDIANA" ===== negro azulado de base · cromo neutro (blanco hueso) · el color se reserva para los 4 estados · orbes profundos detrás del vidrio */
:root,[data-theme="dark"]{
  --bg:#020617;--ink:#F1F5F9;--ink-2:#B4C0D2;--ink-3:#8B9BB4;
  --brand:#E2E8F0;--brand-ink:#0B1220;--data:#CBD5E1;--data-soft:rgba(203,213,225,.12);--data-line:rgba(203,213,225,.36);
  --fiel:#34D399;--activo:#3CC8E6;--incons:#FBBF24;--inact:#F87171;--evento:#FBBF24;--parcial:#7C8CA8;--on-st:#04101F;
  --glass:rgba(22,32,52,.46);--glass-side:rgba(12,19,36,.62);--glass-strong:rgba(10,16,32,.96);--glass-line:rgba(226,232,240,.14);--glass-hi:rgba(255,255,255,.12);
  --field:rgba(255,255,255,.05);--field-2:rgba(255,255,255,.10);--line:rgba(226,232,240,.12);--band:rgba(203,213,225,.05);--shadow:0 22px 44px -24px rgba(0,0,0,.9);--scrim:rgba(2,5,14,.66);--sb:rgba(203,213,225,.24);--sbh:rgba(203,213,225,.45);
  --o1:#1B2A44;--o1a:.90;--o2:#2A3A56;--o2a:.45;--o3:#0B6B58;--o3a:.34;--blur:26px;
}
[data-theme="light"]{
  --bg:#EDF0F5;--ink:#0B1220;--ink-2:#3D4B63;--ink-3:#566580;
  --brand:#0F172A;--brand-ink:#FFFFFF;--data:#1E293B;--data-soft:rgba(15,23,42,.07);--data-line:rgba(15,23,42,.30);
  --fiel:#047857;--activo:#0B6580;--incons:#92400E;--inact:#B91C1C;--evento:#B45309;--parcial:#8794AC;--on-st:#FFFFFF;
  --glass:rgba(255,255,255,.56);--glass-side:rgba(255,255,255,.74);--glass-strong:rgba(255,255,255,.97);--glass-line:rgba(255,255,255,.9);--glass-hi:rgba(255,255,255,.95);
  --field:rgba(15,23,42,.045);--field-2:rgba(15,23,42,.09);--line:rgba(15,23,42,.11);--band:rgba(15,23,42,.045);--shadow:0 0 0 1px rgba(15,23,42,.05),0 22px 40px -26px rgba(15,23,42,.4);--scrim:rgba(11,18,38,.35);--sb:rgba(15,23,42,.22);--sbh:rgba(15,23,42,.42);
  --o1:#9FB0C9;--o1a:.55;--o2:#C4CFDF;--o2a:.55;--o3:#8FD9C1;--o3a:.42;--blur:26px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--sbh);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
html{background:var(--bg)}
body{min-height:100dvh;font:400 14px/1.45 "Instrument Sans",system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
/* fondo con profundidad: es lo que el vidrio desenfoca y refracta (sin él, el glassmorphism no se ve) */
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.scene i{position:absolute;border-radius:50%;filter:blur(90px)}
.scene .a{width:640px;height:640px;left:-180px;top:-160px;background:var(--o1);opacity:var(--o1a)}
.scene .b{width:600px;height:600px;right:-200px;top:20%;background:var(--o2);opacity:var(--o2a)}
.scene .c{width:560px;height:560px;left:30%;bottom:-260px;background:var(--o3);opacity:var(--o3a)}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em;font-weight:700}
.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--data);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-strong)}}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ===== MARCO: SIDEBAR + CONTENIDO ===== */
:root{--tc:.34s}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);gap:16px;max-width:1560px;margin:0 auto;padding:14px;transition:grid-template-columns var(--tc) var(--ease)}
.side-wrap{position:sticky;top:14px;height:calc(100dvh - 28px);min-width:0}
.side-nav{height:100%;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:var(--glass-side);transition:padding var(--tc) var(--ease)}
/* asa en el borde: no cambia de sitio al colapsar, solo gira */
.edge{position:absolute;top:26px;right:-12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--ink-2);background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:0 4px 12px -4px rgba(0,0,0,.5);z-index:5;transition:color .18s,background .18s}
.edge:hover{color:var(--ink);background:var(--field-2)}
.edge svg{transition:transform var(--tc) var(--ease)}
.shell.col .edge svg{transform:rotate(180deg)}
.sb-top{display:flex;align-items:center;gap:10px;padding:2px 2px 0 2px;margin-bottom:14px;transition:padding var(--tc) var(--ease)}
.logo{display:flex;align-items:center;gap:10px;font:700 15px "Bricolage Grotesque";letter-spacing:-.01em;min-width:0;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:16px;flex:none}
.mark svg.i{stroke-width:2.6}
.lbl{display:inline-block;max-width:170px;opacity:1;overflow:hidden;white-space:nowrap;vertical-align:middle;transition:max-width var(--tc) var(--ease),opacity .2s}
.nav-v{display:grid;gap:2px;margin-bottom:14px}
.nav-v button{position:relative;display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink-2);text-align:left;transition:background .18s,color .18s,padding var(--tc) var(--ease),gap var(--tc) var(--ease)}
.nav-v button svg.i{font-size:17px;flex:none}
.nav-v button:hover{color:var(--ink);background:var(--field)}
.nav-v button[aria-current="page"]{color:var(--ink);background:var(--field-2)}
.nav-v button[aria-current="page"]:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--ink)}
.nav-v .nav-ic{max-height:0;opacity:0;visibility:hidden;overflow:hidden;transition:max-height var(--tc) var(--ease),opacity .2s,background .18s,color .18s,padding var(--tc) var(--ease),gap var(--tc) var(--ease)}
.nav-ic .pt{position:absolute;right:9px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.hr{height:1px;background:var(--line);margin:0 -2px 14px;flex:none;transition:opacity .2s,margin var(--tc) var(--ease)}
.filt{display:flex;flex-direction:column;gap:14px;padding:2px;margin:-2px -2px 12px;max-height:380px;overflow:hidden;visibility:visible;transition:max-height var(--tc) var(--ease),opacity .22s,margin var(--tc) var(--ease),visibility 0s}
.f-h{display:flex;align-items:center;justify-content:space-between;padding:0 2px;min-height:22px}
.f-h b{font:600 11px "Instrument Sans";letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.reset{font-size:12px;font-weight:600;color:var(--ink-2);padding:3px 8px;border-radius:7px;border:1px solid var(--line)}
.reset:hover{color:var(--ink);background:var(--field)}
.sg{display:flex;flex-direction:column;gap:7px}
.lab{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px;font-size:12px;color:var(--ink-3)}
.lab span:first-child{color:var(--ink-2);font-weight:600}
.lab .rg{font:500 11px "JetBrains Mono"}
.tg{display:grid;gap:6px}
.tg.c2{grid-template-columns:1fr 1fr}.tg.c4{grid-template-columns:repeat(4,1fr)}
.tb{display:flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 8px;border-radius:10px;font-weight:600;font-size:13px;color:var(--ink-2);background:var(--field);border:1px solid var(--line);transition:background .18s,border-color .18s,color .18s,transform .1s}
.tb:hover{border-color:var(--data-line);color:var(--ink)}
.tb:active{transform:scale(.97)}
.tb small{font:500 11px "JetBrains Mono";color:var(--ink-3)}
.tb .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none;transition:all .18s}
.tb[aria-pressed="true"]{background:var(--data-soft);border-color:var(--data-line);color:var(--ink)}
.tb[aria-pressed="true"] small{color:var(--ink-2)}
.tb[aria-pressed="true"] .dot{background:var(--ink);border-color:var(--ink)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.sw>span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.switch{position:relative;width:38px;height:22px;border-radius:99px;background:var(--field-2);border:1px solid var(--line);transition:background .18s,border-color .18s;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--ink-3);transition:transform .18s,background .18s}
.switch[aria-checked="true"]{background:var(--data-soft);border-color:var(--data-line)}
.switch[aria-checked="true"]:after{transform:translateX(16px);background:var(--ink)}
.sidefoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.35}
.sidefoot .tx{max-width:180px;overflow:hidden;white-space:nowrap;opacity:1;transition:max-width var(--tc) var(--ease),opacity .2s}
.sidefoot b{color:var(--ink-2);font-weight:600}
.icon-btn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--ink-2);font-size:17px;transition:color .18s;flex:none}
.icon-btn:hover{color:var(--ink)}
.ui-oculto{display:none!important}
@media(min-width:981px){
  .shell.col{grid-template-columns:72px minmax(0,1fr)}
  .side-nav.col{padding:14px 10px}
  .side-nav.col .lbl{max-width:0;opacity:0}
  .side-nav.col .sb-top{padding-left:11px;gap:0}
  .side-nav.col .nav-v button{padding-left:16px;gap:0}
  .side-nav.col .nav-v .nav-ic{max-height:38px;opacity:1;visibility:visible}
  .side-nav.col .hr{opacity:0;margin-bottom:0}
  .side-nav.col .filt{max-height:0;opacity:0;margin-bottom:0;pointer-events:none;visibility:hidden;transition:max-height var(--tc) var(--ease),opacity .2s,margin var(--tc) var(--ease),visibility 0s var(--tc)}
  .side-nav.col .sidefoot{justify-content:center;gap:0}
  .side-nav.col .sidefoot .tx{max-width:0;opacity:0}
}
/* ===== CABECERA DEL CONTENIDO ===== */
.main{min-width:0;container-type:inline-size;container-name:main}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 2px 14px}
.top h1{font-size:26px;line-height:1.1}
.alertas{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.al{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;color:var(--ink-2)}
.al.w{color:var(--incons);border-color:color-mix(in srgb,var(--incons) 45%,transparent)}
.al svg.i{font-size:13px}
.mtop,.mtabs{display:none}
/* ===== MALLA DEL DASHBOARD ===== */
.dash{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c{border-radius:var(--r-lg);padding:16px 18px;min-width:0}
.c-h{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 10px;margin-bottom:12px}
.c-h h3{font-size:15px}
.c-h .sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.eyebrow{font:600 10.5px "Instrument Sans";letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.up{color:var(--fiel)}.down{color:var(--inact)}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}
/* KPIs */
.kpi{grid-column:span 2;position:relative;text-align:left;transition:border-color .18s;display:flex;flex-direction:column;gap:2px}
.kpi.h{grid-column:span 4;display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,40%);column-gap:14px;align-content:start}
.kpi.h .eyebrow{grid-column:1/-1}.kpi.h .v,.kpi.h .d{grid-column:1}
button.kpi:hover{border-color:var(--data-line)}
.kpi .v{font:700 34px/1.05 "Bricolage Grotesque";letter-spacing:-.03em;margin-top:6px}
.kpi.h .v{font-size:46px}
.kpi .d{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.kpi .d b{font-family:"JetBrains Mono";font-weight:500}
.kpi .go{position:absolute;right:14px;top:14px;color:var(--ink-3);font-size:14px}
.kpi .spk{grid-column:2;grid-row:2/4;align-self:end;width:100%}
.kpi .spk svg{width:100%;height:auto;display:block}
.mini2{display:flex;height:6px;border-radius:9px;overflow:hidden;gap:2px;background:var(--field);margin-top:10px}
.mini2 i{display:block}
/* estado */
.est-row{display:grid;grid-template-columns:96px 1fr 44px 40px;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 8px;margin:0 -8px;border-radius:10px;transition:background .18s}
.est-row:hover{background:var(--field)}
.est-row .nom{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.est-row .nom i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.est-row .nom small{display:block;font:500 10.5px "JetBrains Mono";color:var(--ink-3);font-weight:400}
.est-row .bar{height:8px;border-radius:9px;background:var(--field);overflow:hidden}
.est-row .bar i{display:block;height:100%;border-radius:9px;background:var(--c)}
.est-row .n{font:700 20px "Bricolage Grotesque";text-align:right;color:var(--c)}
.est-row .p{font:500 11.5px "JetBrains Mono";color:var(--ink-3);text-align:right}
.mov{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mov div{border-radius:11px;padding:8px 11px;background:var(--field);border:1px solid var(--line)}
.mov b{display:block;font:700 19px "Bricolage Grotesque"}
.mov small{color:var(--ink-3);font-size:11.5px}
.qmini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;align-items:end}
.qmini div{text-align:center;font-size:11.5px;color:var(--ink-3)}
.qmini .col{width:60%;margin:4px auto;border-radius:6px 6px 3px 3px;background:var(--data);opacity:.3}
.qmini .on .col{opacity:1}
.qmini b{display:block;font:700 13px "JetBrains Mono";color:var(--ink)}
/* gráfico */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:500 10.5px "JetBrains Mono";fill:var(--ink-3)}
.chart .pm{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.chart .qlab{font:600 10px "Instrument Sans";letter-spacing:.12em;fill:var(--ink-3)}
.chart .pt{cursor:default}
.tip{position:absolute;pointer-events:none;z-index:5;padding:8px 11px;border-radius:11px;font-size:12px;min-width:130px;opacity:0;transition:opacity .12s;transform:translate(-50%,-100%);white-space:nowrap;background:var(--glass-strong)}
.tip.on{opacity:1}.tip b{display:block;font:700 15px "Bricolage Grotesque"}.tip span{color:var(--ink-3)}
.tip .ev{color:var(--evento);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* ranking + mapa de calor */
.ord{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.seg{display:flex;gap:2px;flex-wrap:wrap;padding:3px;border-radius:11px;background:var(--field);border:1px solid var(--line)}
.seg button{padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:all .18s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--data-soft);color:var(--data);box-shadow:inset 0 0 0 1px var(--data-line)}
.hm{display:grid;gap:3px;align-items:center}
.hm .hd{font:500 10px "JetBrains Mono";color:var(--ink-3);text-align:center}
.hm .hd.l{text-align:right}
.hm .fila{display:contents}
.hm .pos{font:600 11px "JetBrains Mono";color:var(--ink-3);text-align:right;padding-right:4px}
.hm .pos.t3{color:var(--data)}
.hm .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;min-width:0;text-align:left;padding:2px 0;border-radius:8px}
.hm .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm .fila:hover .nm{color:var(--data)}
.hm .c1{height:24px;border-radius:6px;display:grid;place-items:center;font:600 10px "JetBrains Mono";color:var(--on-st);background:color-mix(in srgb,var(--cc) 88%,var(--bg));cursor:default;transition:transform .12s}
.hm .c1:hover,.hm .c1:focus-visible{transform:scale(1.12);z-index:2;outline:2px solid var(--ink);outline-offset:1px}
.hm .c1.vac{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 5px);color:transparent}
.hm .tot{font:600 12px "JetBrains Mono";text-align:right}
.hm .dl{font:600 10.5px "Instrument Sans";text-align:right;white-space:nowrap}
.emb{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--data-soft);border:1px solid var(--data-line);color:var(--data);font-size:14px;position:relative;flex:none}
.emb.letra{font:700 15px/1 "Bricolage Grotesque"}
.emb .sub2{position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;border-radius:4px;background:var(--bg);border:1px solid var(--data-line);display:grid;place-items:center;font-size:7.5px}
.escala{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-3)}
.escala i{display:inline-block;width:12px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* panel lateral con pestañas */
.side .seg{margin:-2px 0 12px;width:max-content;max-width:100%}
.lectura{display:grid}
.ins{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.ins:first-child{border-top:0;padding-top:2px}
.ins .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--data-soft);border:1px solid var(--data-line);color:var(--data);font-size:15px}
.ins p{color:var(--ink-2);line-height:1.45;font-size:13.5px}.ins p b{color:var(--ink);font-weight:600}
.ins p b.up{color:var(--fiel)}.ins p b.down{color:var(--inact)}
.rk{display:grid;grid-template-columns:26px minmax(0,1fr) 54px;gap:10px;align-items:center;width:100%;text-align:left;padding:5px 6px;margin:0 -6px;border-radius:10px;transition:background .18s}
.rk:hover{background:var(--field)}
.rk .nm{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.rk .nm small{font-weight:400;color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.rk .tr{height:6px;border-radius:9px;background:var(--field);margin-top:5px}
.rk .tr i{display:block;height:100%;border-radius:9px}
.rk .pc{text-align:right;font:600 13px "JetBrains Mono"}

  return {curso,ps,dist,A,T,pct:T?A/T*100:0,riesgo,evo,grupos:[...porGrupo.entries()].map(([gid,g])=>({gid,...g,pct:g.t?g.a/g.t*100:0})).sort((x,y)=>y.pct-x.pct),tipos:[...porTipo.entries()].map(([tipo,v])=>({tipo,...v,pct:v.t?v.a/v.t*100:0}))};

function analisis(r){
  const ps=r.ps, comp=r.evo.filter(e=>!e.parcial);
  const porQ=QS.map(q=>{let a=0,t=0,n=0;const dist={Fiel:0,Activo:0,Inconstante:0,Inactivo:0},fechas=new Set();
    for(const p of ps){let pa=0,pt=0;for(const [di,as] of p.s)if(D.q[di]===q){pt++;pa+=as;a+=as;t++;fechas.add(di)}if(pt){dist[status(pa/pt*100)]++;n++}}
    return {q,pct:t?a/t*100:0,t,semanas:fechas.size,dist,n}}).filter(x=>x.t>0);
  let mov=null;
  if(porQ.length>=2){const q0=porQ[porQ.length-2].q,q1=porQ[porQ.length-1].q;let up=0,down=0,igual=0;
    const nivel=(p,q)=>{let a=0,t=0;for(const [di,as] of p.s)if(D.q[di]===q){t++;a+=as}return t?status(a/t*100):null};
    for(const p of ps){const s0=nivel(p,q0),s1=nivel(p,q1);if(s0&&s1){const d=NIVEL[s1]-NIVEL[s0];d>0?up++:d<0?down++:igual++}}
    mov={q0,q1,up,down,igual}}
  const nSem=innerWidth<760?8:12, fechas=comp.slice(-nSem).map(e=>e.di), idx=new Set(fechas), celdas=new Map();
  for(const p of ps)for(const [di,as] of p.sg){if(!idx.has(di))continue;const k=p.gid+'|'+di,c=celdas.get(k)||[0,0];c[0]+=as;c[1]++;celdas.set(k,c)}
  const grupos=r.grupos.map(g=>{const fila=fechas.map(di=>{const c=celdas.get(g.gid+'|'+di);return c&&c[1]?{a:c[0],t:c[1],pct:c[0]/c[1]*100}:null});
    const vals=fila.filter(Boolean), rec=vals.slice(-4), previas=vals.slice(-8,-4);
    const mr=rec.length?rec.reduce((s,c)=>s+c.pct,0)/rec.length:null, mp=previas.length?previas.reduce((s,c)=>s+c.pct,0)/previas.length:null;
    const miembros=ps.filter(p=>p.gid===g.gid), riesgo=miembros.reduce((s,p)=>s+p.ar,0);
    return {...g,fila,reciente:mr,delta:mr!=null&&mp!=null?mr-mp:null,riesgo,miembros:miembros.length,sinDatos:g.t>0&&g.a===0}});
  const rol=new Map();for(const p of ps){const k=p.r||'Sin rol',[a,t]=sumar(enQ(p.s)),x=rol.get(k)||{a:0,t:0,k:0};x.a+=a;x.t+=t;x.k++;rol.set(k,x)}
  const formales=ps.filter(p=>p.m).length;
  const memb=[[true,'Miembros formales'],[false,'Aún no son miembros']].map(([m,nombre])=>{let a=0,t=0,k=0;for(const p of ps)if(!!p.m===m){const [x,y]=sumar(enQ(p.s));a+=x;t+=y;k++}return {nombre,k,pct:t?a/t*100:0}}).filter(x=>x.k>0);
  const ev=comp.filter(e=>e.ev), reg=comp.filter(e=>!e.ev), media=a=>a.length?a.reduce((s,e)=>s+e.pct,0)/a.length:null;
  const ult4=comp.slice(-4), prev4=comp.slice(-8,-4);
  return {memb,porQ,mov,fechasHM:fechas,grupos,rol:[...rol.entries()].map(([nombre,v])=>({nombre,...v,pct:v.t?v.a/v.t*100:0})).sort((a,b)=>b.k-a.k),formales,
    evProm:media(ev),regProm:media(reg),nEv:ev.length,m4:media(ult4),mp4:prev4.length?media(prev4):null,n4:ult4.length};
}
function pctPersona(p){const [a,t]=sumar(enQ(p.s));return {a,t,pct:t?a/t*100:0}}

/* ---- gráficos ---- */
const anchoG=()=>{const el=document.querySelector('#chart-w');return Math.max(300,Math.min(1000,(el?el.clientWidth:0)||innerWidth-(innerWidth<980?56:640)))};
function spark(evo,W,H){
  const pts=evo.filter(e=>!e.parcial).slice(-14);if(pts.length<2)return '';
  const m=4,max=Math.max(...pts.map(e=>e.pct)),min=Math.min(...pts.map(e=>e.pct)),lo=Math.max(0,min-5),hi=max+5;
  const x=i=>m+i*(W-2*m)/(pts.length-1),y=v=>m+(H-2*m)*(1-(v-lo)/(hi-lo));
  const l=pts.map((e,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(e.pct).toFixed(1)}`).join(' '),u=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${l}" fill="none" stroke="var(--data)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(u.pct).toFixed(1)}" r="3.5" fill="var(--data)"/></svg>`;
}
function grafico(evo0,cursoPt,W,H){
  const evo=cursoPt?evo0.concat([cursoPt]):evo0;
  if(!evo.length)return '<div class="vacio">No hay sesiones en este período.</div>';
  const L=32,R=10,T=22,B=24,n=evo.length,max=Math.max(...evo.map(e=>e.pct)),ym0=Math.max(20,Math.ceil((max+8)/10)*10),pasos=ym0<=40?10:ym0<=80?20:25,ym=Math.ceil(ym0/pasos)*pasos;
  const x=i=>L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)),y=v=>T+(H-T-B)*(1-v/ym);
  const completas=evo.filter(e=>!e.parcial&&!e.curso),prom=completas.length?completas.reduce((s,e)=>s+e.pct,0)/completas.length:null;
  const grid=[];for(let v=0;v<=ym;v+=pasos)grid.push(v);
  const base=cursoPt?evo.slice(0,-1):evo, linea=base.map((e,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(e.pct).toFixed(1)}`).join(' ');
  const area=base.length?`${linea} L${x(base.length-1).toFixed(1)} ${y(0)} L${x(0).toFixed(1)} ${y(0)}Z`:'';
  const tramo=cursoPt&&base.length?`<line x1="${x(n-2).toFixed(1)}" y1="${y(base[base.length-1].pct).toFixed(1)}" x2="${x(n-1).toFixed(1)}" y2="${y(cursoPt.pct).toFixed(1)}" stroke="var(--parcial)" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>`:'';
  let bandas='',ini=0;
  for(let i=1;i<=n;i++){const qa=D.q[D.fechas.indexOf(evo[ini].f)],qb=i<n?D.q[D.fechas.indexOf(evo[i].f)]:null;
    if(qb!==qa){const x0=ini===0?L:(x(ini-1)+x(ini))/2,x1=i===n?W-R:(x(i-1)+x(i))/2;
      bandas+=`${QS.indexOf(qa)%2===0?`<rect x="${x0.toFixed(1)}" y="${T}" width="${(x1-x0).toFixed(1)}" height="${H-T-B}" fill="var(--band)"/>`:''}<text class="qlab" x="${((x0+x1)/2).toFixed(1)}" y="${T-8}" text-anchor="middle">${qa}</text>`;ini=i}}
  /* los nombres de evento NO se dibujan fijos: salen en el tooltip al pasar el cursor (o enfocar) */
  const puntos=evo.map((e,i)=>{const fin=i===(cursoPt?n-2:n-1),cx=x(i).toFixed(1),cy=y(e.pct).toFixed(1);
    if(e.curso)return `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--bg)" stroke="var(--parcial)" stroke-width="2" stroke-dasharray="3 2.5"/>`;
    if(e.ev&&!e.parcial)return `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--evento)"/>`;
    if(e.parcial)return `<circle cx="${cx}" cy="${cy}" r="4" fill="var(--parcial)"/>`;
    return `<circle cx="${cx}" cy="${cy}" r="${fin?5:3}" fill="${fin?'var(--data)':'var(--bg)'}" stroke="var(--data)" stroke-width="2"/>`}).join('');
  const sp=(W-L-R)/Math.max(1,n-1),k=Math.max(1,Math.ceil(42/sp)),et=evo.map((e,i)=>((n-1-i)%k===0)?`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${dm(e.f)}</text>`:'').join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución semanal del porcentaje de asistencia">${bandas}
    ${grid.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-7}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`).join('')}
    <path d="${area}" fill="var(--data-soft)"/>${tramo}<path d="${linea}" fill="none" stroke="var(--data)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${prom!=null?`<line x1="${L}" x2="${W-R}" y1="${y(prom)}" y2="${y(prom)}" stroke="var(--ink-3)" stroke-dasharray="3 5" opacity=".85"/><text class="pm" x="${W-R}" y="${y(prom)-6}" text-anchor="end">prom. ${fmt(prom)}%</text>`:''}
    ${puntos}${et}<line class="guia" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink-3)" opacity="0"/></svg><div class="tip glass"></div></div>
    <div class="legend"><span><i style="background:var(--data)"></i>Asistencia semanal</span><span><i style="background:var(--evento)"></i>Semana con evento</span><span><i style="background:var(--parcial)"></i>Parcial (≤${P.parcial})</span>${cursoPt?'<span><i style="border:1.5px dashed var(--parcial);background:none"></i>En curso</span>':''}</div>`;
}
function ligarGrafico(evo0,cursoPt,W,raiz){
  const evo=cursoPt?evo0.concat([cursoPt]):evo0;
  const ch=(raiz||document).querySelector('.chart');if(!ch)return;const svg=ch.querySelector('svg'),tip=ch.querySelector('.tip'),guia=ch.querySelector('.guia'),L=32,R=10,n=evo.length;
  const mover=ev=>{const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*W;let i=n===1?0:Math.round((px-L)/((W-L-R)/(n-1)));i=Math.max(0,Math.min(n-1,i));

    lectura:`<div class="lectura">${insights.map(([i,t])=>`<div class="ins"><div class="ico">${ic(i)}</div><p>${t}</p></div>`).join('')||'<div class="vacio">Sin datos suficientes.</div>'}</div>`,
    riesgo:`${rg.map(g=>`<button class="rk" data-dr="grupo:${g.gid}">${emblema(g.n)}<div><div class="nm"><span>${esc(g.n)}</span><small>${g.riesgo} de ${g.miembros}</small></div><div class="tr"><i style="width:${g.riesgo/g.miembros/maxR*100}%;background:var(--inact)"></i></div></div><div class="pc">${fmt(g.riesgo/g.miembros*100,0)}%</div></button>`).join('')||'<div class="vacio">Nadie está en riesgo en esta vista.</div>'}
      <button class="btn-l" data-dr="riesgo:">Ver las ${r.riesgo} personas ${ic('arrow')}</button>
      ${sinReg.length?`<div class="aviso"><div class="ico">${ic('alert')}</div><div><b>Sin registros:</b> ${sinReg.map(g=>esc(g.n)).join(', ')}. No cuentan como riesgo.</div></div>`:''}`,
    perfil:`<div class="sep">Tipo de grupo</div>${tipos.map(v=>fila(v.tipo,`${TIPOS[v.tipo]} · ${v.k}`,v.pct)).join('')}<div class="sep">Rol</div>${a.rol.map(v=>fila(v.nombre,`${v.k} personas`,v.pct)).join('')}<div class="sep">Membresía</div>${a.memb.map(v=>fila(v.nombre,`${v.k} personas`,v.pct)).join('')}`};
  const lateral=`<section class="c glass s5 side"><div class="c-h"><h3>Qué está pasando</h3></div>
    <div class="seg" role="tablist">${[['lectura','Lectura'],['riesgo','Riesgo'],['perfil','Perfil']].map(([k,t])=>`<button role="tab" data-side="${k}" aria-selected="${ST.side===k}">${t}</button>`).join('')}</div>${tabs[ST.side]}</section>`;
  const out={html:kpis+evolucion+estado+mapa+lateral,r,sinReg,W,H};
  out.bind=()=>{ligarGrafico(r.evo,r.curso,out.W);ligarTooltipsMapa();ajustarMedidas(out)};

}

/* ---- utilidades de listas ---- */
const normT=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const qPct=(p,q)=>{let a=0,t=0;for(const [di,as] of p.s)if(D.q[di]===q){t++;a+=as}return t?a/t*100:null};
const bdg=s=>`<span class="bdg" style="--c:${COLOR[s]}">${s}</span>`;
const rcTxt=rc=>rc>=2?`<span class="up">${rc} seguidas</span>`:rc<=-2?`<span class="down">${-rc} sin asistir</span>`:'<span style="color:var(--ink-3)">—</span>';
function descargarCSV(nombre,cab,filas){
  const e=v=>{v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const txt='\ufeff'+[cab,...filas].map(r=>r.map(e).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function serie(vals,W,H){
  const pts=vals.map((v,i)=>v==null?null:[i,v]).filter(Boolean);if(pts.length<2)return '';
  const m=3,mx=Math.max(...pts.map(x=>x[1])),mn=Math.min(...pts.map(x=>x[1])),lo=Math.max(0,mn-4),hi=mx+4,n=vals.length;
  const X=i=>m+i*(W-2*m)/Math.max(1,n-1),Y=v=>m+(H-2*m)*(1-(v-lo)/(hi-lo||1));
  const l=pts.map(([i,v],k)=>`${k?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' '),u=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${l}" fill="none" stroke="var(--data)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(u[0]).toFixed(1)}" cy="${Y(u[1]).toFixed(1)}" r="3" fill="var(--data)"/></svg>`;
}
const nivelQ=(p,q)=>{const v=qPct(p,q);return v==null?null:status(v)};
function personasMov(id){const [q0,q1,s0,s1]=id.split('|');return vista().filter(p=>nivelQ(p,q0)===s0&&nivelQ(p,q1)===s1).map(p=>({p,...pctPersona(p)}))}

    for(const [di,as] of p.sg){const k=p.gid+'|'+D.q[di],c=gq.get(k)||[0,0];c[0]+=as;c[1]++;gq.set(k,c)}}

    qp:QS.map(q=>{const c=gq.get(g.gid+'|'+q);return c&&c[1]?c[0]/c[1]*100:null})}));

      <div class="ord"><span>a</span><div class="seg">${qd.map(q=>`<button data-mq1="${q}" aria-pressed="${ST.mq1===q}">${q}</button>`).join('')}</div></div></div>
    <div class="mx"><div class="h l"></div>${ORDEN.map(x=>`<div class="h"><i style="background:${COLOR[x]}"></i>${x.slice(0,5)}</div>`).join('')}<div class="h">Total</div>
      ${ORDEN.map(s0=>`<div class="h l"><i style="background:${COLOR[s0]}"></i>${s0}</div>${ORDEN.map(s1=>celda(s0,s1)).join('')}<div class="tot">${ORDEN.reduce((t,s1)=>t+(M[s0][s1]||0),0)}</div>`).join('')}</div>

    <div class="cq"><div></div>${QS.map(q=>`<div class="hd">${q}</div>`).join('')}
    ${G.map(g=>`<button class="nm" data-dr="grupo:${g.gid}">${emblema(g.n)}<span>${esc(g.n)}</span></button>${g.qp.map((v,i)=>v==null?`<div class="qc vac" aria-label="${QS[i]}: sin sesiones"></div>`:`<div class="qc" style="--cc:${COLOR[status(v)]}" title="${esc(g.n)} · ${QS[i]}: ${fmt(v)}%">${Math.round(v)}</div>`).join('')}`).join('')}</div></section>`;
  const barra=`<div class="s12 tbar" style="grid-column:span 12;margin:4px 2px 0"><div class="ord"><span>Tipo</span><div class="seg">${[['','Todos'],['GDC','GDC'],['GDA','GDA'],['GBU','GBU']].map(([k,t])=>`<button data-gt="${k}" aria-pressed="${ST.gt===k}">${t}</button>`).join('')}</div></div>

/* ---- PERSONAS ---- */
function filasPersonas(){return vista().map(p=>{const per=pctPersona(p);return {p,pct:per.pct,qs:QS.map(q=>qPct(p,q)),est:status(per.pct),sin:p.rc<0?-p.rc:0}})}
const clavePersona=(x,k)=>k==='n'?normT(x.p.n):k==='g'?normT(x.p.g):k==='r'?normT(x.p.r||''):k==='pct'?x.pct:k==='est'?NIVEL[x.est]:k==='sin'?x.sin:k==='ua'?(x.p.ua||''):(k[0]==='q'?(x.qs[+k.slice(1)]??-1):0);
function listaFiltradaPersonas(todas){
  const q=normT(ST.pq.trim());
  const L=todas.filter(x=>(!q||normT(x.p.n).includes(q))&&(!ST.pe||x.est===ST.pe)&&(!ST.pr||(x.p.r||'Sin rol')===ST.pr)&&(!ST.pg||x.p.gid===ST.pg)&&(!ST.pz||x.p.ar));
  L.sort((a,b)=>{const A=clavePersona(a,ST.po),B=clavePersona(b,ST.po);return ((A<B?-1:A>B?1:0)*ST.pd)||normT(a.p.n).localeCompare(normT(b.p.n))});
  return L;
}

  const filas=vis.map(x=>{const p=x.p;return `<tr data-pp="${p.i}" tabindex="0"><td><div class="nom"><span class="av" aria-hidden="true">${esc(iniciales(p.n))}</span><span>${esc(p.n)}<small class="xsg">${esc(p.g)}</small></span></div></td>

/* ---- RIESGO ---- */
function filasRiesgo(){return vista().filter(p=>p.ar).map(p=>({p,pct:pctPersona(p).pct,sin:p.rc<0?-p.rc:0}))}
const claveRiesgo=(x,k)=>k==='n'?normT(x.p.n):k==='g'?normT(x.p.g):k==='r'?normT(x.p.r||''):k==='pct'?x.pct:k==='ua'?(x.p.ua||''):x.sin;
function listaFiltradaRiesgo(todas){
  const q=normT(ST.rq.trim());
  const L=todas.filter(x=>(!q||normT(x.p.n).includes(q))&&(!ST.rg||x.p.gid===ST.rg)&&(!ST.rr||(x.p.r||'Sin rol')===ST.rr));
  L.sort((a,b)=>{const A=claveRiesgo(a,ST.ro),B=claveRiesgo(b,ST.ro);return ((A<B?-1:A>B?1:0)*ST.rd)||normT(a.p.n).localeCompare(normT(b.p.n))});
  return L;
}
function tablaRiesgo(todas){
  const L=listaFiltradaRiesgo(todas),vis=L.slice(0,ST.rm);
  const th=(k,t,cls='')=>`<th class="${cls}" aria-sort="${ST.ro===k?(ST.rd>0?'ascending':'descending'):'none'}"><button data-rs="${k}">${t}${ST.ro===k?(ST.rd>0?' ▲':' ▼'):''}</button></th>`;
  const filas=vis.map(x=>{const p=x.p;return `<tr data-pp="${p.i}" tabindex="0"><td><div class="nom"><span class="av" aria-hidden="true">${esc(iniciales(p.n))}</span><span>${esc(p.n)}<small class="xsg">${esc(p.g)}</small></span></div></td>
    <td class="hid-xs"><div class="nom" style="min-width:0;font-weight:500">${emblema(p.g)}${esc(p.g)}</div></td><td class="hid-md">${esc(p.r||'—')}</td>
    <td class="hq" style="color:var(--inact)">${x.sin} sesiones</td><td class="hq hid-sm" style="color:var(--ink-2)">${p.ua?dlargo(p.ua)+' '+p.ua.slice(0,4):'nunca'}</td>
    <td><div class="pc" style="--c:${COLOR[status(x.pct)]}"><b>${fmt(x.pct,0)}%</b><span class="trk"><i style="width:${Math.min(100,x.pct)}%"></i></span></div></td></tr>`}).join('');
  return {n:L.length,L,html:`<table class="tp"><thead><tr>${th('n','Nombre')}${th('g','Grupo','hid-xs')}${th('r','Rol','hid-md')}${th('sin','Sin asistir')}${th('ua','Última asistencia','hid-sm')}${th('pct','Asistencia')}</tr></thead><tbody>${filas||'<tr><td colspan="6" class="vacio">Nadie coincide con estos filtros.</td></tr>'}</tbody></table>${L.length>vis.length?`<button class="mas" data-rmas="1">Mostrar más (${L.length-vis.length})</button>`:''}`};
}
function vRiesgo(){
  const r=resumen(), todas=filasRiesgo(), n=r.ps.length, k=todas.length;
  const media=k?todas.reduce((s,x)=>s+x.sin,0)/k:0, nunca=todas.filter(x=>!x.p.ua).length;
  const sinDatos=new Set(r.grupos.filter(g=>g.t>0&&g.a===0).map(g=>g.gid));
  const tot=new Map();for(const p of r.ps)tot.set(p.gid,(tot.get(p.gid)||0)+1);
  const pg=new Map();for(const x of todas){if(sinDatos.has(x.p.gid))continue;const g=pg.get(x.p.gid)||{n:x.p.g,k:0};g.k++;pg.set(x.p.gid,g)}
  const grupos=[...pg.entries()].map(([gid,g])=>({gid,...g,t:tot.get(gid),pr:g.k/tot.get(gid)})).sort((a,b)=>b.pr-a.pr);
  const maxPr=Math.max(0.0001,...grupos.map(g=>g.pr));
  const cubos=[[4,5,'4–5 sesiones'],[6,8,'6–8 sesiones'],[9,12,'9–12 sesiones'],[13,9999,'13 o más']].map(([a,b,t])=>({t,n:todas.filter(x=>x.sin>=a&&x.sin<=b).length}));
  const maxC=Math.max(1,...cubos.map(c=>c.n));
  const roles=[...new Set(todas.map(x=>x.p.r||'Sin rol'))].sort();
  const gsel=[...new Map(todas.map(x=>[x.p.gid,x.p.g])).entries()].sort((a,b)=>a[1].localeCompare(b[1],'es'));
  const T=tablaRiesgo(todas);
  const kpis=`<div class="c glass kpi k3"><div class="eyebrow">En riesgo</div><div class="v num" style="color:var(--inact)">${k}</div><div class="d">${fmt(n?k/n*100:0,0)}% de ${n} personas</div></div>
    <div class="c glass kpi k3"><div class="eyebrow">Sin asistir (media)</div><div class="v num">${fmt(media,0)}</div><div class="d">sesiones seguidas</div></div>

    <div class="c glass kpi k3"><div class="eyebrow">Más afectado</div><div class="v" style="font-size:22px;margin-top:10px">${grupos[0]?esc(grupos[0].n):'—'}</div><div class="d">${grupos[0]?`${grupos[0].k} de ${grupos[0].t} (${fmt(grupos[0].pr*100,0)}%)`:''}</div></div>`;
  const lista=`<section class="c glass s8"><div class="tbar"><label class="busca2">${ic('search')}<input id="rq" type="search" placeholder="Buscar persona" value="${esc(ST.rq)}" autocomplete="off"></label>
    <select class="sel" id="rg" aria-label="Grupo"><option value="">Todos los grupos</option>${gsel.map(([id,nm])=>`<option value="${id}" ${ST.rg===id?'selected':''}>${esc(nm)}</option>`).join('')}</select>
    <select class="sel" id="rr" aria-label="Rol"><option value="">Todos los roles</option>${roles.map(x=>`<option ${ST.rr===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
    <span class="cnt" id="rcount">${T.n} personas</span><button class="btn-s" id="rcsv">${ic('down')}Exportar CSV</button></div><div class="tscroll" id="rtabla">${T.html}</div></section>`;
  const lateral=`<section class="c glass s4"><div class="c-h"><h3>Cuánto llevan sin asistir</h3></div>${cubos.map(c=>`<div class="fila-b" style="grid-template-columns:104px 1fr 34px"><div class="tn">${c.t}</div><div class="barra"><i style="width:${c.n/maxC*100}%;background:var(--inact)"></i></div><div class="num" style="text-align:right">${c.n}</div></div>`).join('')}
    <div class="sep" style="margin-top:20px">Por grupo</div>${grupos.slice(0,8).map(g=>`<button class="rk" data-dr="grupo:${g.gid}">${emblema(g.n)}<div><div class="nm"><span>${esc(g.n)}</span><small>${g.k} de ${g.t}</small></div><div class="tr"><i style="width:${g.pr/maxPr*100}%;background:var(--inact)"></i></div></div><div class="pc">${fmt(g.pr*100,0)}%</div></button>`).join('')||'<div class="vacio">Sin datos.</div>'}</section>`;
  const out={html:kpis+lista+lateral,r,sinReg:[]};
  out.bind=()=>{
    const ligarFilas=()=>{
      document.querySelectorAll('[data-pp]').forEach(tr=>{tr.onclick=()=>abrirPanel('persona:'+tr.dataset.pp);tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();abrirPanel('persona:'+tr.dataset.pp)}}});
      document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{const kk=b.dataset.rs;if(ST.ro===kk)ST.rd=-ST.rd;else{ST.ro=kk;ST.rd=(kk==='n'||kk==='g'||kk==='r')?1:-1}repintar()});
      const m=document.querySelector('[data-rmas]');if(m)m.onclick=()=>{ST.rm+=50;repintar()};
    };
    const repintar=()=>{const t=tablaRiesgo(todas);$('#rtabla').innerHTML=t.html;$('#rcount').textContent=t.n+' personas';ligarFilas()};
    ligarFilas();
    $('#rq').oninput=e=>{ST.rq=e.target.value;ST.rm=50;repintar()};
    $('#rg').onchange=e=>{ST.rg=e.target.value;ST.rm=50;render()};
    $('#rr').onchange=e=>{ST.rr=e.target.value;ST.rm=50;render()};
    $('#rcsv').onclick=()=>descargarCSV('en_riesgo.csv',['Nombre','Grupo','Rol','Sesiones sin asistir','Última asistencia','Asistencia % (período)'],
      listaFiltradaRiesgo(todas).map(x=>[x.p.n,x.p.g,x.p.r||'',x.sin,x.p.ua||'nunca',fmt(x.pct,1)]));
  };
  return out;
}

const PROY_DEF=['j1','betta'];
const filtrosActivos=()=>ST.proy.size<2||ST.qs.size<QS.length||!ST.via;
function rangoPeriodo(){

/* estado en la URL: el enlace comparte la vista exacta (pestaña, filtros y orden) y Atrás funciona entre pestañas */
function leerURL(){
  try{const h=new URLSearchParams(location.hash.slice(1));
    const t=h.get('t');if(t&&NAV.some(x=>x[0]===t))ST.tab=t;
    const p=(h.get('p')||'').split(',').filter(x=>PROY_DEF.includes(x));if(p.length)ST.proy=new Set(p);
    const q=(h.get('q')||'').split(',').filter(x=>QS.includes(x));if(q.length)ST.qs=new Set(q);
    if(h.get('v')==='0')ST.via=false;else if(h.get('v')==='1')ST.via=true;
    const o=h.get('o');if(['periodo','reciente','riesgo','nombre'].includes(o))ST.orden=o;
  }catch(e){}
}
function guardarURL(){
  try{const push=ST._push;ST._push=false;
    const h=new URLSearchParams();h.set('t',ST.tab);
    if(ST.proy.size<2)h.set('p',[...ST.proy].join(','));
    if(ST.qs.size<QS.length)h.set('q',QS.filter(x=>ST.qs.has(x)).join(','));
    if(!ST.via)h.set('v','0');
    if(ST.orden!=='periodo')h.set('o',ST.orden);
    const nuevo='#'+h.toString();if(nuevo===location.hash)return;
    history[push?'pushState':'replaceState'](null,'',nuevo);
  }catch(e){}
}
/* colapsar/expandir SIN reconstruir: se cambia una clase y el CSS anima; al terminar se vuelve a medir el gráfico */
let _tcol;
function alternarColapso(forzar){
  ST.col=forzar===undefined?!ST.col:forzar;try{localStorage.setItem('j1col',ST.col?'1':'0')}catch(e){}
  const sh=document.querySelector('.shell'),sb=$('#sidebar'),eb=$('#col-btn');if(!sh||!sb)return;
  sh.classList.toggle('col',ST.col);sb.classList.toggle('col',ST.col);
  if(eb){eb.setAttribute('aria-expanded',String(!ST.col));eb.setAttribute('aria-label',ST.col?'Expandir menú':'Contraer menú');eb.title=ST.col?'Expandir':'Contraer'}
  clearTimeout(_tcol);_tcol=setTimeout(()=>{if(typeof CTX!=='undefined'&&CTX&&CTX.medir)CTX.medir()},400);
}
let CTX=null;
/* mide el ancho real tras pintar: el gráfico se redibuja a tamaño 1:1 y las fechas del mapa se ocultan solo si se pisan */
function ajustarMedidas(ctx){
  if(!ctx)return;
  const w=document.querySelector('#chart-w');
  if(w&&w.clientWidth>200&&Math.abs(w.clientWidth-ctx.W)>6){ctx.W=w.clientWidth;w.innerHTML=grafico(ctx.r.evo,ctx.r.curso,ctx.W,ctx.H);ligarGrafico(ctx.r.evo,ctx.r.curso,ctx.W)}
  const hs=[...document.querySelectorAll('.hm .hd[data-d]')],c=document.querySelector('.hm .c1');if(!hs.length||!c)return;
  const k=Math.max(1,Math.ceil(40/(c.getBoundingClientRect().width+3))),n=hs.length;
  hs.forEach((h,i)=>{h.style.visibility=((n-1-i)%k===0)?'visible':'hidden'});
}
function render(){
  let cuerpo='',ctx=null;
  ctx=({resumen:vResumen,grupos:vGrupos,personas:vPersonas,riesgo:vRiesgo})[ST.tab]();cuerpo=ctx.html;
  const sinReg=resumen().grupos.filter(g=>g.t>0&&g.a===0);
  $('#app').innerHTML=`<div class="shell ${ST.col?'col':''}">${sidebar()}
    <div class="main">
      <div class="mtop"><button class="icon-btn glass" id="abrir-m" aria-label="Abrir filtros">${ic('menu')}</button><div class="logo"><span class="mark">${ic('check')}</span>Asistencia J1</div></div>
      <nav class="mtabs glass" aria-label="Secciones">${NAV.map(([k,n])=>`<button data-t="${k}" ${ST.tab===k?'aria-current="page"':''}>${n}</button>`).join('')}</nav>
      <header class="top"><h1>${NAV.find(x=>x[0]===ST.tab)[1]}</h1>
        <div class="alertas">${D.en_curso?`<span class="al glass" title="Todavía están registrando: no entra en los totales">${ic('clock')}Semana del ${dm(D.en_curso)} en curso</span>`:''}${sinReg.length?`<span class="al glass w" title="Sin ningún registro de asistencia en el período">${ic('alert')}Sin registros: ${sinReg.map(g=>esc(g.n)).join(', ')}</span>`:''}${P.sin_persona?`<span class="al glass w" title="Asistencias cuyo DNI no está en el maestro y no se pudo asociar a nadie: no se cuentan. Revisar si cambió un DNI.">${ic('alert')}${P.sin_persona} asistencias sin persona en el maestro</span>`:''}</div></header>
      <main class="dash fade">${cuerpo}</main></div></div>
    ${ST.menu?'<div class="scrim" id="scrim-m" style="z-index:65"></div>':''}`;
  $('#tema').onclick=()=>{tema(document.documentElement.dataset.theme==='dark'?'light':'dark');render();renderPanel()};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ST.tab=b.dataset.t;ST.menu=false;ST._push=true;render();scrollTo(0,0)});
  const refrescar=()=>{render();if(ST.dr)renderPanel()};
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const k=b.dataset.p;if(ST.proy.has(k)){if(ST.proy.size>1)ST.proy.delete(k)}else ST.proy.add(k);refrescar()});
  const vs=$('#via-sw');if(vs)vs.onclick=()=>{ST.via=!ST.via;refrescar()};
  const rs=$('#reset');if(rs)rs.onclick=()=>{ST.proy=new Set(PROY_DEF);ST.via=true;ST.qs=new Set(QS);refrescar()};
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const k=b.dataset.q;if(ST.qs.has(k)){if(ST.qs.size>1)ST.qs.delete(k)}else ST.qs.add(k);refrescar()});
  document.querySelectorAll('[data-ord]').forEach(b=>b.onclick=()=>{ST.orden=b.dataset.ord;render()});
  document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{ST.side=b.dataset.side;render()});
  document.querySelectorAll('[data-dr]').forEach(b=>b.onclick=()=>abrirPanel(b.dataset.dr));
  const cb=$('#col-btn');if(cb)cb.onclick=()=>alternarColapso();
  const af=$('#abrir-filtros');if(af)af.onclick=()=>alternarColapso(false);
  const am=$('#abrir-m');if(am)am.onclick=()=>{ST.menu=true;render()};
  const cm=$('#cerrar-m'),sm=$('#scrim-m');const cerrar=()=>{ST.menu=false;render()};if(cm)cm.onclick=cerrar;if(sm)sm.onclick=cerrar;
  CTX=ctx;ctx.medir=()=>{if(ctx.W)ajustarMedidas(ctx)};if(ctx.bind)ctx.bind();
  document.querySelectorAll('[data-mq0]').forEach(b=>b.onclick=()=>{ST.mq0=b.dataset.mq0;render()});
  document.querySelectorAll('[data-mq1]').forEach(b=>b.onclick=()=>{ST.mq1=b.dataset.mq1;render()});
  document.querySelectorAll('[data-gt]').forEach(b=>b.onclick=()=>{ST.gt=b.dataset.gt;render()});
  document.querySelectorAll('[data-gs]').forEach(b=>b.onclick=()=>{ST.gs=b.dataset.gs;render()});
  guardarURL();
}
leerURL();
render();
addEventListener('popstate',()=>{leerURL();render()});
let _rz,_w=innerWidth;addEventListener('resize',()=>{if(innerWidth===_w)return;_w=innerWidth;clearTimeout(_rz);_rz=setTimeout(()=>{render();if(ST.dr)renderPanel()},180)});
</script>
